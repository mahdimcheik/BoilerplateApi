services:
  master:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-master
    ports:
      - "9333:9333"      # Port HTTP de l'interface Master
      - "19333:19333"    # Port gRPC
    command: "master -ip=master -peers=master:9333"
    volumes:
      - master_data:/data
    restart: unless-stopped

  volume:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-volume
    ports:
      - "8080:8080"      # Port HTTP du noeud de volume
      - "18080:18080"    # Port gRPC
    command: "volume -mserver=master:9333 -ip=volume -port=8080"
    volumes:
      - volume_data:/data
    depends_on:
      - master
    restart: unless-stopped

  filer:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-filer
    ports:
      - "8888:8888"      # Port HTTP du Filer
      - "18888:18888"    # Port gRPC
      - "8333:8333"      # Port de l'API S3 (très utile pour ASP.NET Core)
    # -s3.config is required, not optional: started with a bare -s3 the gateway has no identities
    # and rejects every SigV4-signed request ("Signed request requires setting up SeaweedFS S3
    # authentication"), which is all the AWS SDK ever sends. The keys in s3.json must match
    # S3_ACCESS_KEY / S3_SECRET_KEY in .env.
    command: "filer -master=master:9333 -ip=filer -s3 -s3.config=/etc/seaweedfs/s3.json"
    volumes:
      - filer_data:/data
      - ./s3.json:/etc/seaweedfs/s3.json:ro
    depends_on:
      - master
      - volume
    restart: unless-stopped

volumes:
  master_data:
  volume_data:
  filer_data: